<section id="accountGate" class="panel">
  <img src="/mark.svg" alt="" width="40" height="40">
  <h1>Sign in to Routiq</h1>
  <form id="accountForm">
    <label>Email<input name="email" type="email" autocomplete="username" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary">Sign in</button>
  </form>
  <p id="accountMessage" role="status">Opening your workspace…</p>
  <button class="secondary" id="switchAccount" hidden>Use another account</button>
</section>
<div id="syncStatus" role="status" hidden></div>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin"><title>Routiq Beacon</title>
<link rel="stylesheet" href="/leaflet/leaflet.css">
<style>
:root{color-scheme:dark;font-family:Inter,"Segoe UI",Arial,sans-serif;background:#101013;color:#f5f1fb}*{box-sizing:border-box}body{margin:0}main{max-width:860px;margin:auto;padding:clamp(20px,5vh,56px) 16px}header{display:flex;align-items:center;gap:8px;font-size:28px;font-weight:700;letter-spacing:-1.7px;margin-bottom:20px}header svg{width:32px}.card{background:#1d1b22;border:1px solid #413a49;border-radius:14px;overflow:hidden}.heading{padding:19px 22px}h1{font-size:1.55rem;letter-spacing:-.8px;margin:0 0 5px}p{color:#cdc9d4;line-height:1.5;margin:0}#status{font-size:.94rem}.map-wrap{position:relative;isolation:isolate}#liveMap{height:clamp(310px,56vh,540px);background:#303034}.leaflet-tile-pane{filter:grayscale(.84) saturate(.45) invert(.9) hue-rotate(164deg) brightness(1.1) contrast(.8)}.leaflet-control-zoom a{background:#28262f;color:#f2edf9;border-color:#55505b}.leaflet-container .leaflet-control-attribution{background:#1e1d23dc;color:#dad6df}.leaflet-control-attribution a{color:#dfc8ff}#follow{position:absolute;right:12px;top:12px;z-index:1000;background:#292530;border:1px solid #827389;color:#eee5f8;border-radius:7px;padding:10px 13px;font:inherit;font-weight:600;font-size:.86rem;cursor:pointer}#follow[aria-pressed=true]{color:#d5f6ab;border-color:#769060}.detail{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:15px 22px;flex-wrap:wrap}#coords{color:#eee7f5;font-variant-numeric:tabular-nums}#fix,#tileStatus{font-size:.82rem;color:#bcb7c7}#tileStatus:not(:empty){padding:0 22px 12px}button:focus-visible{outline:2px solid #d8bbff}[hidden]{display:none!important}@media(max-width:520px){main{padding:18px 12px}header{margin-bottom:16px}.heading,.detail{padding:15px}.detail{display:grid}#liveMap{height:53vh;min-height:290px}}
</style></head><body><main><header><svg viewBox="0 0 40 36" fill="#bfa5ff" aria-hidden="true"><path d="M2 29 17 4h9L11 29H2Zm13 0 9-15h8l6 15h-9l-2-6-4 6Z"/></svg>routiq</header>
<section class="card"><div class="heading"><h1>Activity Beacon</h1><p id="status" role="status">Opening your sharing link…</p></div>
<div id="position" hidden><div class="map-wrap"><div id="liveMap" role="region" aria-label="Map of the shared activity location"></div><button type="button" id="follow" aria-pressed="true">Following</button></div><div class="detail"><p id="coords"></p><p id="fix"></p></div><p id="tileStatus" role="status"></p></div></section></main>
<script src="/leaflet/leaflet.js" defer></script><script src="/viewer.js" type="module"></script></body></html>
